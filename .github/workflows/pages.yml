name: Publish course site
on:
  workflow_dispatch:
permissions:
  # GitHub requires push access to read draft release assets. Return to read
  # after v4.0.0 is published; this workflow is only dispatched manually.
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the reviewed static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.0.0 --pattern site-v4.zip --dir .site-download
          python scripts/extract_site_asset.py .site-download/site-v4.zip site-output
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-output
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
