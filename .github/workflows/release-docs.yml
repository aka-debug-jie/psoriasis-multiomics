name: Add source links to validated packages
run-name: Source download notes · ${{ inputs.platform }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform whose full native validation has passed
        type: choice
        options: [windows-x64, macos-intel, macos-arm64]
        required: true
      kind:
        description: Documentation to append without changing tested members
        type: choice
        options: [source-links, windows-licences]
        default: source-links
        required: true
permissions:
  contents: write
concurrency:
  group: release-docs-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Append source locations and verify unchanged tested members
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_PLATFORM: ${{ inputs.platform }}
          COURSE_DOCUMENTATION_KIND: ${{ inputs.kind }}
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path
          assert json.loads(subprocess.check_output(
              ['gh', 'release', 'view', 'v4.0.0', '--json', 'isDraft']
          ))['isDraft'], 'This operation is limited to the unpublished draft'
          platform = os.environ['COURSE_PLATFORM']
          extra_args = []
          shared_runtime = None
          if os.environ['COURSE_DOCUMENTATION_KIND'] == 'windows-licences':
              assert platform == 'windows-x64'
              config = json.loads(Path('config/windows_notice_asset.json').read_text())
              download = Path('.notice-download')
              subprocess.run(['gh', 'release', 'download', 'v4.0.0',
                              '--pattern', config['asset'], '--dir', str(download)], check=True)
              payload = download / config['asset']
              assert payload.stat().st_size == config['bytes']
              assert hashlib.sha256(payload.read_bytes()).hexdigest() == config['sha256']
              with zipfile.ZipFile(payload) as archive:
                  assert len(archive.namelist()) == len(set(archive.namelist()))
                  assert all(name == Path(name).name for name in archive.namelist())
                  archive.extractall(download / 'files')
              extra_args = ['--supplement-dir', str(download / 'files')]
          for language in ['zh-CN', 'en']:
              folder = Path('.release-docs') / language
              folder.mkdir(parents=True)
              archive = f'pmo-{language}-{platform}.zip'
              manifest = f'{language}-{platform}-manifest.json'
              subprocess.run(['gh', 'release', 'download', 'v4.0.0',
                              '--pattern', archive, '--pattern', manifest,
                              '--dir', str(folder)], check=True)
              validation = json.loads((folder / manifest).read_text())['validation']
              assert validation['platform'] == platform
              assert validation['language'] == language
              assert len(validation['lessons']) == 13
              assert all(x['status'] == 'passed' for x in validation['lessons'])
              assert validation['numeric_comparison'] == 'passed'
              assert validation['network_isolation'] == 'passed'
              assert validation['ordinary_user'] and validation['offline_first_initialization']
              if extra_args:
                  with zipfile.ZipFile(folder / archive) as bundle:
                      prefix = Path(archive).stem + '/resources/'
                      identity = json.loads(bundle.read(prefix + 'bundle.json'))
                      with bundle.open(prefix + 'runtime/seed.zip') as seed:
                          runtime_sha256 = hashlib.file_digest(seed, 'sha256').hexdigest()
                      assert runtime_sha256 == identity['runtime_sha256']
                  assert shared_runtime is None or shared_runtime == runtime_sha256
                  shared_runtime = runtime_sha256
                  record = json.loads((folder / manifest).read_text())
                  record['runtime_sha256_verified'] = runtime_sha256
                  (folder / manifest).write_text(json.dumps(record, indent=2) + '\n')
              subprocess.run([sys.executable, 'scripts/add_source_links.py',
                              str(folder / archive), str(folder / manifest), *extra_args], check=True)
              subprocess.run(['gh', 'release', 'upload', 'v4.0.0',
                              str(folder / archive), str(folder / manifest),
                              '--clobber'], check=True)
              (folder / archive).unlink()
